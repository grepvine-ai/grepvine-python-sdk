name: Regenerate and validate SDK

on:
  workflow_dispatch:
    inputs:
      snapshot_commit:
        description: Snapshot commit pushed by Grepvine (empty uses current main)
        type: string
        required: false
  push:
    branches: [main]
    paths-ignore: ["spec/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          fetch-depth: 0
      - name: Check the requested snapshot is still current
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot_commit != ''
        env:
          SNAPSHOT_COMMIT: ${{ inputs.snapshot_commit }}
        run: |
          [[ "$SNAPSHOT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git diff --exit-code "$SNAPSHOT_COMMIT" HEAD -- spec
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/generate.py
      - name: Lint and type-check
        run: |
          uv lock --check
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy
      - run: uv run --frozen pytest
      - name: Build and test installed package
        run: |
          uv build
          uv run --frozen python scripts/check_package.py
      - name: Check generated files in ordinary CI
        if: github.event_name != 'workflow_dispatch'
        run: git diff --exit-code -- src/grepvine_sdk/_generated
      - name: Commit validated generated updates
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/grepvine_sdk/_generated
          if ! git diff --cached --quiet; then
            source_commit=$(python3 -c 'import json; print(json.load(open("spec/source.json"))["commit"])')
            git commit -m "Generate SDK from Grepvine $source_commit"
            git push origin HEAD:main
          fi
