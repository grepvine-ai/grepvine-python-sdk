name: Build and publish SDK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish (PEP 440, e.g. 0.2.0rc1 or 0.2.0.dev1)
        type: string
        required: true
      repository:
        description: Package index to publish to (PyPI accepts only pre-release versions from a manual run)
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      repository: ${{ steps.version.outputs.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Set package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REPOSITORY: ${{ inputs.repository }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            requested=${RELEASE_TAG#v}
            repository=pypi
          else
            requested=$INPUT_VERSION
            repository=$INPUT_REPOSITORY
          fi
          uv version --frozen "$requested"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          prerelease=false
          if [[ "$version" =~ (a|b|rc|\.dev)[0-9]+ ]]; then
            prerelease=true
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$repository" == pypi && "$prerelease" != true ]]; then
            echo "::error::Manual runs publish only pre-release versions to PyPI; publish a GitHub release for $version"
            exit 1
          fi
          echo "Publishing grepvine-sdk $version to $repository (pre-release: $prerelease)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
      - run: uv sync --frozen
      - name: Check generated files are current
        run: |
          uv run --frozen python scripts/generate.py
          git diff --exit-code -- src/grepvine_sdk/generated
      - name: Lint and type-check
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy
      - run: uv run --frozen pytest
      - name: Build and test installed package
        run: |
          uv build
          uv run --frozen python scripts/check_package.py
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: ${{ needs.build.outputs.repository }}
      url: ${{ needs.build.outputs.repository == 'pypi' && 'https://pypi.org' || 'https://test.pypi.org' }}/project/grepvine-sdk/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        if: needs.build.outputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: needs.build.outputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
