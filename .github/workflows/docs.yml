name: Documentation

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Set the released package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: uv version --frozen "${RELEASE_TAG#v}"
      - name: Read the pinned design-system commit
        id: design-system
        run: echo "ref=$(cat docs/theme/design-system.ref)" >> "$GITHUB_OUTPUT"
      # grepvine-design-system is private; DESIGN_SYSTEM_DEPLOY_KEY is a read-only deploy key on it.
      - uses: actions/checkout@v7
        with:
          repository: grepvine-ai/grepvine-design-system
          ref: ${{ steps.design-system.outputs.ref }}
          path: .design-system
          ssh-key: ${{ secrets.DESIGN_SYSTEM_DEPLOY_KEY }}
          persist-credentials: false
      - run: uv sync --frozen
      - name: Build documentation
        env:
          GREPVINE_DESIGN_SYSTEM: ${{ github.workspace }}/.design-system
        run: uv run --frozen python scripts/build_docs.py
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          path: site/

  deploy:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
