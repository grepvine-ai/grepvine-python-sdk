[project]
name = "grepvine"
dynamic = ["version"]
description = "Python SDK for the Grepvine search API"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Grepvine" }]
keywords = ["grepvine", "search", "regex", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28,<0.29",
    "attrs>=25",
    "python-dateutil>=2.9",
    "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://grepvine.ai"
Documentation = "https://grepvine-ai.github.io/grepvine-python-sdk/"
Source = "https://github.com/grepvine-ai/grepvine-python-sdk"
Issues = "https://github.com/grepvine-ai/grepvine-python-sdk/issues"

[build-system]
requires = ["hatchling>=1.27,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.uv]
# Reinstall the project when its version can change: a new commit or tag, or a pinned version.
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
  { env = "SETUPTOOLS_SCM_PRETEND_VERSION" },
]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/NOTICE", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/grepvine"]

[dependency-groups]
dev = [
    "openapi-python-client==0.29.1",
    "pytest>=8,<10",
    "anyio>=4,<5",
    "ruff==0.15.13",
    "mypy>=1.16,<2",
    "types-python-dateutil>=2.9",
    "pdoc==16.0.0",
    "types-pyyaml>=6",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/grepvine/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The package re-exports the names listed in each module's __all__.
per-file-ignores = { "src/grepvine/__init__.py" = ["F403", "F405"] }

[tool.mypy]
files = ["src", "tests", "scripts", "examples"]
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
  "integration: needs a live Grepvine endpoint (GREPVINE_SDK_TEST_ENDPOINT, GREPVINE_SDK_TEST_API_KEY, GREPVINE_SDK_TEST_ORGANIZATION)",
]
