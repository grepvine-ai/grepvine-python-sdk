[project]
name = "grepvine-sdk"
version = "0.1.0"
description = "Generated Python SDK for the Grepvine API"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = ["httpx>=0.28,<0.29", "attrs>=25", "python-dateutil>=2.9"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/grepvine_sdk"]

[dependency-groups]
dev = ["openapi-python-client==0.29.1", "pytest>=8,<10", "anyio>=4,<5", "ruff==0.15.13", "mypy>=1.16,<2", "types-python-dateutil>=2.9", "pdoc==16.0.0"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/grepvine_sdk/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src", "tests", "scripts", "examples"]
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
